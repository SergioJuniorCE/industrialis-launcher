packages:
  - "apps/*"
  - "packages/*"

# Restores the pre-pnpm-11 layout: .npmrc is auth/registry-only since pnpm 11,
# so public-hoist-pattern[]=* there is ignored. Vercel's Next.js output
# collection expects the hoisted layout.
publicHoistPattern:
  - "*"

allowBuilds:
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  ssh2: false
