name: Build and release native launcher

on:
  push:
    tags:
      - "launcher-v*"
      - "launcher-preview-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "major.minor.patch (build artifacts only; does not publish)"
        required: true
        default: "0.6.0"
      channel:
        description: "Build-only channel; tag pushes publish releases"
        type: choice
        options: [preview, stable]
        default: stable

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-build.yml
    with:
      version: ${{ inputs.version }}
      channel: ${{ startsWith(github.ref_name, 'launcher-preview-v') && 'preview' || inputs.channel || 'stable' }}

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/launcher-v') || startsWith(github.ref, 'refs/tags/launcher-preview-v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*-*64
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'launcher-preview-v') }}
          make_latest: ${{ startsWith(github.ref_name, 'launcher-v') }}
          generate_release_notes: true
          body_path: apps/launcher/RELEASE_NOTES.md
          files: release-assets/*
