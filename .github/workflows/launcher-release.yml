name: Build and release native launcher

on:
  push:
    tags:
      - "launcher-v*"
      - "launcher-preview-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "major.minor.patch (build artifacts only; does not publish)"
        required: true
        default: "0.4.4"
      channel:
        description: "Build-only channel; tag pushes publish releases"
        type: choice
        options: [preview, stable]
        default: stable

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CHANNEL: ${{ startsWith(github.ref_name, 'launcher-preview-v') && 'preview' || inputs.channel || 'stable' }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri xvfb xauth openbox dbus xdg-utils fonts-dejavu-core python3 libxres1
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'launcher-nsis'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $tools 'nsis-3.11.zip'
          curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 --output $archive https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip
          if ($LASTEXITCODE -ne 0) { throw 'NSIS portable download failed' }
          $expected = 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'NSIS archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force
          $compiler = Join-Path $tools 'nsis-3.11/makensis.exe'
          $version = (& $compiler /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v3.11') { throw 'Unexpected NSIS compiler version' }
          "MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stamp launcher version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          cargo fetch --locked --manifest-path apps/launcher/Cargo.toml
          if [[ "$RELEASE_TAG" == launcher-preview-v* ]]; then
            version="${RELEASE_TAG#launcher-preview-v}"
          elif [[ "$RELEASE_TAG" == launcher-v* ]]; then
            version="${RELEASE_TAG#launcher-v}"
          else
            version="${BUILD_VERSION:-0.4.0}"
          fi
          node scripts/launcher-version.mjs "$version"
          cargo update --workspace --offline --manifest-path apps/launcher/Cargo.toml
      - name: Test macOS backend and core
        if: runner.os == 'macOS'
        working-directory: apps/launcher
        run: cargo test -p industrialis-core -p industrialis-backend --lib --tests --jobs 1 --locked
      - name: Test backend, core and launcher interactions
        if: runner.os != 'macOS'
        working-directory: apps/launcher
        run: cargo test --workspace --lib --bins --tests --jobs 1 --features industrialis-app/packaged-updates --locked -- --test-threads=1
      - name: Build native process fixtures
        if: runner.os == 'Windows'
        working-directory: apps/launcher
        run: cargo build -p industrialis-app -p industrialis-backend -p industrialis-cli --examples --bin industrialis-cli --jobs 1 --locked
      - name: Test detached game lifetime
        if: runner.os == 'Windows'
        run: node --test scripts/game-broker.test.mjs
      - name: Linux native renderer startup and shutdown
        if: runner.os == 'Linux'
        run: sh scripts/test-linux-render.sh
      - name: Test version and artifact contracts
        run: node --test scripts/packaging.test.mjs scripts/notices.test.mjs scripts/windows-runtime.test.mjs
      - name: Test Windows installer wait and guest interop declarations
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/test-windows-process-exit.ps1
      - name: Test Linux portable extraction guards
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/linux-portable-smoke.test.py
      - name: Test prepared stable update channel
        working-directory: apps/launcher
        run: cargo test -p industrialis-backend --lib release_updater::tests --features stable-updates --jobs 1 --locked
      - name: Build and package
        shell: bash
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
        run: node scripts/build-launcher.mjs --channel "$BUILD_CHANNEL"
      - name: Verify and boot the actual Linux portable
        if: runner.os == 'Linux'
        env:
          LAUNCHER_PACKAGE_CHANNEL: ${{ env.BUILD_CHANNEL }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: sh scripts/test-linux-portable.sh "$PWD/apps/launcher/dist/IndustrialisLauncher-linux-x64.tar.gz" "$PWD/apps/launcher/target/release/industrialis" "$PWD/apps/launcher/dist"
      - name: Retain Linux packaged acceptance evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-acceptance
          path: |
            apps/launcher/dist/verification.json
            apps/launcher/dist/portable-render.png
            apps/launcher/dist/portable-native.log
          if-no-files-found: warn
      - name: Retain failed Linux executable for diagnosis
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-diagnostics
          path: |
            apps/launcher/target/release/industrialis
            apps/launcher/dist/IndustrialisLauncher-linux-x64.tar.gz
          retention-days: 3
          if-no-files-found: warn
      - name: Verify Windows artifact bytes, metadata and notices
        if: runner.os == 'Windows'
        shell: powershell
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
        run: powershell -NoProfile -File scripts/verify-windows-artifacts.ps1 -Channel $env:BUILD_CHANNEL
      - name: Windows installer handoff smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/test-windows-updater.ps1 -MakeNSIS "$env:MAKENSIS"
      - name: Windows legacy-folder migration
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File scripts/test-windows-migration.ps1 -MakeNSIS "$env:MAKENSIS"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.artifact }}
          path: |
            apps/launcher/dist/*.exe
            apps/launcher/dist/*.zip
            apps/launcher/dist/*.dmg
            apps/launcher/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/launcher-v') || startsWith(github.ref, 'refs/tags/launcher-preview-v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*-*64
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'launcher-preview-v') }}
          make_latest: ${{ startsWith(github.ref_name, 'launcher-v') }}
          generate_release_notes: true
          body_path: apps/launcher/RELEASE_NOTES.md
          files: release-assets/*
