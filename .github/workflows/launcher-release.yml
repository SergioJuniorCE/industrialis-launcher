name: Build and release launcher

on:
  push:
    tags:
      - "launcher-v*"

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: linux
            arch: x64
          - name: Windows x64
            platform: windows-latest
            target: win32
            arch: x64
          - name: macOS Apple Silicon
            platform: macos-14
            target: darwin
            arch: arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#launcher-v}"
          node scripts/set-launcher-version.mjs "$version"

      - name: Build Electron artifacts
        run: pnpm --dir apps/launcher exec electron-forge make --platform ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}-${{ matrix.arch }}
          path: apps/launcher/out/make/**
          if-no-files-found: error

  release:
    name: Publish launcher release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: Automated build for ${{ github.ref_name }} at commit ${{ github.sha }}.
          generate_release_notes: true
          files: release-assets/**/*
