name: Build and release launcher

on:
  push:
    branches:
      - master

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate pushed commits
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: pnpm commitlint --from "$BEFORE_SHA" --to HEAD --verbose

  build:
    name: ${{ matrix.name }}
    needs: commitlint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: linux
            arch: x64
          - name: Windows x64
            platform: windows-latest
            target: win32
            arch: x64
          - name: macOS Apple Silicon
            platform: macos-14
            target: darwin
            arch: arm64
          - name: macOS Intel
            platform: macos-13
            target: darwin
            arch: x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: node scripts/set-launcher-version.mjs "0.1.${{ github.run_number }}"

      - name: Build Electron artifacts
        run: pnpm --dir apps/launcher exec electron-forge make --platform ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}-${{ matrix.arch }}
          path: apps/launcher/out/make/**
          if-no-files-found: error

  release:
    name: Publish launcher release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.1.${{ github.run_number }}
          name: Industrialis Launcher v0.1.${{ github.run_number }}
          body: Automated build from master commit ${{ github.sha }}.
          generate_release_notes: true
          files: release-assets/**/*
