name: Build and release launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target
          shared-key: launcher-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            zip \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build launcher artifacts (Windows)
        if: matrix.platform == 'windows'
        run: pnpm build:launcher:release

      - name: Build launcher artifacts (macOS/Linux)
        if: matrix.platform != 'windows'
        run: |
          chmod +x scripts/build-launcher.sh
          pnpm build:launcher:release

      - name: Upload launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: industrialis-launcher-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/launcher/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: industrialis-launcher-*-${{ github.sha }}
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Industrialis Launcher build ${{ github.run_number }}
          body: |
            Automated launcher release from `master`.

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Artifacts
            - **Windows:** NSIS installer (`.exe`), MSI installer (`.msi`), portable ZIP
            - **macOS:** DMG installer, portable app ZIP
            - **Linux:** DEB installer, AppImage, portable binary ZIP
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
