# Shared Cargo build cache (mbx) policy for this workspace.
# Only workspace-level settings are allowed here; the machine budget lives in
# %APPDATA%\mbx\config.toml. Rationale and measurements: DEV_BUILDS.md.

# Keep Cargo's own incremental state for profile.dev. Without this mbx sets
# CARGO_INCREMENTAL=0 and a small app edit takes 20-45 s instead of 15 s.
incremental = true
