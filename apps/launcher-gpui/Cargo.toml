[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
industrialis-core = { path = "crates/core", version = "0.1.0" }
industrialis-backend = { path = "crates/backend", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
md5 = "0.8"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sha1 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util", "net"] }
# ZIP needs ordinary deflate, not the optional Zopfli encoder. The explicit
# flate2 backend also makes backend-only/CLI builds independent of GPUI features.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# Keep development/test builds bounded: retain module and line information for
# backtraces, but avoid full symbols and workspace-wide incremental caches.
# Tests and backend crates stay non-incremental. Reuse compiled dependencies.
[profile.dev]
debug = 1
incremental = false

# GPUI rebuilds layout during native window moves. Optimize the framework in
# development too, while keeping launcher code unoptimized and debuggable.
[profile.dev.package.gpui-pre]
opt-level = 3

# Cache only the frequently edited UI crate, with fewer codegen units than the
# incremental default of 256. Tests explicitly opt out to avoid duplicate large
# caches across test/packaging feature combinations.
[profile.dev.package.industrialis-app]
incremental = true
codegen-units = 32

[profile.test.package.industrialis-app]
incremental = false
codegen-units = 16
