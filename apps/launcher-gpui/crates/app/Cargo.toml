[package]
name = "industrialis-app"
default-run = "industrialis"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[features]
dev-watch = []
# Only distribution builds check for launcher updates. Cargo run stays offline.
packaged-updates = []
stable-updates = ["packaged-updates", "industrialis-backend/stable-updates"]

[[bin]]
name = "industrialis"
path = "src/main.rs"

# A separate development executable avoids Windows file locks from ordinary
# launcher runs. Distribution builds do not enable this target's feature.
[[bin]]
name = "industrialis-dev"
path = "src/main.rs"
required-features = ["dev-watch"]

[[example]]
name = "window_move_bench"
path = "src/window_move_bench.rs"

# Links the actual app under a separate filename for process/activation smoke
# checks without replacing a development executable that is currently running.
[[example]]
name = "profile_ownership_smoke"
path = "src/main.rs"

[dependencies]
industrialis-core.workspace = true
industrialis-backend.workspace = true
anyhow.workspace = true
log = "0.4"
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Pinned to the exact `gpui-pre` snapshot that gpui-component 0.7.x builds
# against. Bump gpui / gpui_platform / gpui-component together.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = "=0.7.1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "yaml-load"] }

[dev-dependencies]
zip.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
raw-window-handle = "0.6.2"
objc = "=0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }
